version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: matab_api
    restart: unless-stopped
    environment:
      MATAB_ENV: ${MATAB_ENV:-production}
      DATABASE_PATH: /app/data/matab.db
      DATABASE_URL: sqlite:////app/data/matab.db
      MATAB_SECRET_KEY: ${MATAB_SECRET_KEY:-matab-docker-production-secret-key-must-be-rotated-64char}
      MATAB_HOST: 0.0.0.0
      MATAB_PORT: 8000
    volumes:
      - matab_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  matab_data:

